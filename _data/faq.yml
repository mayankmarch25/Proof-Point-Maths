# Questions parents ask. Add a new one by copying a block.

- q: Why weekends only?
  a: >-
    Because the person teaching is the person who founded it. I hold a full time
    research role on weekdays and I teach every batch myself on Saturday and
    Sunday. No substitute faculty, no rotating tutors, no batch handed to someone
    you have never met. That is the trade, and it is deliberate.

- q: Which classes do you take?
  a: >-
    Classes 5 to 10 at present. Classes 11 and 12 with JEE foundation open next.
    Message us to be told when that batch starts.

- q: Which boards do you cover?
  a: >-
    CBSE, ICSE and Tamil Nadu State Board. Board specific paper patterns are
    drilled separately in the final term.

- q: My child has given up on maths. Is this the right place?
  a: >-
    Yes, and that is what the diagnostic is for. In almost every case the problem
    is one unclosed gap from an earlier year, not ability. We find it and name it
    in the first session, which is usually the point at which a student starts
    trying again.

- q: How many students in a batch?
  a: >-
    Twelve, capped. When a batch fills we open a new weekend slot rather than add
    a thirteenth chair.

- q: Is one session a week enough?
  a: >-
    It is, if the week between sessions is used. Every student leaves with a
    worked set and an error log. The session is where the method is taught and
    tested. The week is where it is practised.

- q: Do you teach online?
  a: >-
    Yes. Online weekend batches run for students outside Chennai, same batch size
    and the same weekly report.

- q: What does it cost?
  a: >-
    Fees are listed on the Fees page and confirmed on the enquiry call. The first
    diagnostic class is free and carries no obligation.
