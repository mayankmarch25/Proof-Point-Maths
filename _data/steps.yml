# The joining process. Order matters, it is rendered as a numbered sequence.

- title: Enquiry call
  body: >-
    A ten minute call to understand the school, board, current marks and what
    has already been tried. If we are not the right fit, we say so on that call.

- title: Free diagnostic class
  body: >-
    Your child sits a written diagnostic and one full teaching session. You get
    a one page summary of where the actual gaps are, whether or not you enrol.

- title: Batch placement
  body: >-
    Placement is by diagnostic result, not only by school grade. A Class 10
    student with a Class 8 algebra gap starts with a bridging plan running
    alongside the board syllabus.

- title: Weekly proof
  body: >-
    Classes begin. Every week you receive the test score, the topics covered and
    the open items. Every month, a full cumulative paper.
