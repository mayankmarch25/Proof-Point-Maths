# The four "why us" cards on the home page.
# Add or remove a card by adding or removing a block below.

- title: Diagnose before teaching
  body: >-
    Every student starts with a written diagnostic that traces backwards
    through prior years. We find the exact chapter the trouble began, not
    the one the school is currently on.

- title: Small batches, no anonymity
  body: >-
    Twelve students per batch. Every student writes at the board every week.
    Nobody stays quiet at the back for a full term.

- title: Marked like an examiner
  body: >-
    Answers are corrected for method and presentation, not only the final
    number. Steps missing, steps skipped and steps unjustified all cost marks
    in the real paper. They cost marks here too.

- title: Parents see the evidence
  body: >-
    A short written report every week: what was covered, what the test showed,
    what is still open. No vague reassurance and no surprise at the term end.
